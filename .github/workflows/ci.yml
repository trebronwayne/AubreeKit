name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew build --stacktrace

      - name: Upload library files (AAR)
        uses: actions/upload-artifact@v4
        with:
          name: aubree-aar
          path: |
            aubree/build/outputs/aar/*-release.aar
            aubree-compose/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload sample app
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
